<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Anime Streaming Server</title>

<link rel="stylesheet"
href="https://cdn.plyr.io/3.7.8/plyr.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#0b0f14;
    color:white;
    font-family:
    Inter,
    Segoe UI,
    sans-serif;

    height:100vh;
    overflow:hidden;

    display:flex;
}

.sidebar{

    width:340px;

    background:#111827;

    border-right:
    1px solid #1f2937;

    overflow-y:auto;
}

.logo{

    padding:20px;

    font-size:24px;
    font-weight:bold;

    border-bottom:
    1px solid #1f2937;
}

.sidebar h2{

    padding:15px;
    font-size:18px;
}

#videoList{

    list-style:none;
}

.episode-card{

    display:flex;

    gap:10px;

    padding:12px;

    cursor:pointer;

    border-bottom:
    1px solid #1f2937;

    transition:0.2s;
}

.episode-card:hover{

    background:#1f2937;
}

.episode-thumb{

    width:120px;
    height:68px;

    object-fit:cover;

    border-radius:8px;
}

.episode-info{

    flex:1;
}

.episode-title{

    font-size:14px;

    line-height:1.4;
}

.playerArea{

    flex:1;

    display:flex;

    flex-direction:column;

    padding:20px;

    overflow:hidden;
}

.videoContainer{

    position:relative;

    flex:1;
}

video{

    width:100%;
    height:100%;

    background:black;

    border-radius:12px;
}

.loader{

    position:absolute;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);

    z-index:999;

    background:
    rgba(0,0,0,.8);

    padding:20px;

    border-radius:12px;

    display:none;
}

.bottomBar{

    margin-top:15px;

    display:flex;

    gap:10px;

    align-items:center;

    flex-wrap:wrap;
}

select{

    background:#1f2937;

    color:white;

    border:none;

    padding:10px;

    border-radius:8px;
}

button{

    background:#2563eb;

    color:white;

    border:none;

    padding:10px 15px;

    border-radius:8px;

    cursor:pointer;
}

button:hover{

    opacity:.9;
}

.currentEpisode{

    margin-bottom:10px;

    font-size:18px;

    font-weight:600;
}

@media(max-width:900px){

    body{

        flex-direction:column;
    }

    .sidebar{

        width:100%;
        height:250px;
    }

    .playerArea{

        height:calc(100vh - 250px);
    }
}

</style>

</head>

<body>

<div class="sidebar">

    <div class="logo">
        Anime Server
    </div>

    <h2 >Episodes</h2>

    <ul id="videoList"></ul>

</div>

<div class="playerArea">

    <div
    id="episodeName"
    class="currentEpisode">

        Select Episode

    </div>

    <div class="videoContainer">

        <div
        id="loader"
        class="loader">

            Loading...

        </div>

        <video
        id="player"
        class="plyr-video"
        playsinline
        controls>
        </video>

    </div>

    <div class="bottomBar">

        <button onclick="prevEpisode()">
            ⏮ Prev
        </button>

        <button onclick="seekBack()">
            ⏪ 10s
        </button>

        <button onclick="seekForward()">
            ⏩ 10s
        </button>

        <button onclick="nextEpisode()">
            ⏭ Next
        </button>

        <select id="audioTrack">

            <option value="0">
                Hindi
            </option>

            <option value="1">
                English
            </option>

            <option value="2">
                Japanese
            </option>

        </select>

        <select id="boost">

            <option value="1">
                Volume 100%
            </option>

            <option value="1.5">
                Volume 150%
            </option>

            <option value="2">
                Volume 200%
            </option>

            <option value="3">
                Volume 300%
            </option>

        </select>

        <select id="speed">

            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>

        </select>

        <button onclick="reloadVideo()">
            Apply
        </button>

    </div>

</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
window.plyr = new Plyr("#player", {

    seekTime: 10,

    keyboard: {
        focused: true,
        global: true
    },

    controls: [

        "play-large",

        "rewind",
        "play",
        "fast-forward",

        "progress",

        "current-time",
        "duration",

        "mute",
        "volume",

        "settings",

        "pip",

        "airplay",

        "fullscreen"
    ]
});
</script>

</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="app.js"></script>

</body>

</html>
